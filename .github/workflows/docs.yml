name: Generate docs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write
  # grants authority to open PRs
  pull-requests: write  

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run docs generator
        run: |
          python tools/generate_docs.py
      
      - name: Create Pull Request for Docs
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(docs): regenerate docs"
          branch: automation/regenerate-docs
          title: "chore(docs): automated documentation update"
          body: "This is an automated PR containing documentation compiled from code docstrings."
          labels: documentation, automated-pr
