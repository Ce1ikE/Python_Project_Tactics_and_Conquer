name: Generate docs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SDL development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl1.2-dev libsdl2-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: |
          uv sync
      - name: Run docs generator
        run: |
          uv run python tools/generate_docs.py
      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs || true
          git commit -m "chore(docs): regenerate docs" || echo "no changes"
          git push origin HEAD:refs/heads/${GITHUB_REF#refs/heads/}
